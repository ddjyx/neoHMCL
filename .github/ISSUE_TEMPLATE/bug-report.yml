name: Bug 反馈 | Bug Report
description:
  反馈一个 neoHMCL 错误。| File a bug report for neoHMCL.
title: "[Bug] "
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：

        * 该问题确实是 **neoHMCL 的错误**，而**不是 Minecraft 非正常退出**。如果你的 Minecraft 非正常退出，请先检查启动器日志。
        * 你的启动器版本是**最新的构建**。你可以从 [GitHub Actions](https://github.com/ddjyx/neoHMCL/actions/workflows/gradle.yml) 下载最新构建。
        * neoHMCL 是 [HMCL](https://github.com/HMCL-dev/HMCL) 的非官方衍生版，与 HMCL 官方团队无关。**请勿**把 neoHMCL 的问题提交到上游仓库。

        Before submitting, please confirm:

        * The issue is indeed **a bug of neoHMCL**, not an abnormal exit of Minecraft. If your Minecraft exits abnormally, please check the launcher log first.
        * Your launcher is the **latest build**, which can be downloaded from [GitHub Actions](https://github.com/ddjyx/neoHMCL/actions/workflows/gradle.yml).
        * neoHMCL is an unofficial derivative of [HMCL](https://github.com/HMCL-dev/HMCL) and is not affiliated with the HMCL team. **Please do not** report neoHMCL issues to the upstream repository.
  - type: textarea
    id: bug-report
    attributes:
      label: 问题描述 | Bug Description
      description: |
        请尽可能地详细描述你所遇到的问题，并描述如何重新触发这个问题。
        Please describe the bug you met in as much detail as possible. Additionally, describe the steps to reproduce this bug.
      placeholder: |
        1. 点击 HMCL 上的某个按钮 | Click a button named ...
        2. 向下翻页 | Scroll down
        3. ...
    validations:
      required: true
  - type: textarea
    id: hmcl-crash-report-or-logs
    attributes:
      label: 启动器崩溃报告 / 启动器日志文件 | Launcher Crash Report / Launcher Log File
      description: |
        如果你的启动器崩溃了，请将崩溃报告填入 (或将文件拖入) 下方。
        如果你的启动器没有崩溃，请在遇到问题后**不要退出启动器**，在启动器的 “设置 → 通用 → 调试” 一栏中点击 “导出启动器日志”，并将导出的日志拖到下方的输入栏中。
        **请注意：启动器崩溃报告或日志文件是诊断问题的重要依据，请务必上传！**
        
        If your launcher crashes, please fill in (or drag the file in) the following input field with the crash report.
        If your launcher does not crash, please DO NOT EXIT your launcher, click "Export Launcher Logs" in the "Settings → General → Debug" of the launcher, and drag the exported log to the following input field.
        **ATTENTION: The crash report or log file is the key to resolving the bug. Please upload them!**
    validations:
      required: true
